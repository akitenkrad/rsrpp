[workspace]
resolver = "2"
members = ["rsrpp", "rsrpp-cli"]

[workspace.package]
authors = ["akitenkrad"]
edition = "2021"
version = "2.0.2"
description = "Parse research paper PDFs into structured sections."
repository = "https://github.com/akitenkrad/rsrpp.git"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
chrono = "0.4.45"
glob = "0.3.4"
indicatif = "0.18.6"
opencv = { version = "0.100.1", default-features = false, features = ["imgcodecs", "imgproc"] }
quick-xml = "0.42.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = "0.13.4"
sci-rs = "0.4.1"
scraper = "0.27.0"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
strum = { version = "0.28.0", features = ["derive"] }
test-log = { version = "0.2.21", features = ["trace"] }
openai-tools = "3.0.0"
base64 = "0.23"

[workspace.metadata.release]
tag-prefix = ""
