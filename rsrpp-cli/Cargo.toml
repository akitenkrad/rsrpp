[package]
name = "rsrpp-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Command-line tool that parses research paper PDFs into structured JSON sections."
homepage = "https://github.com/akitenkrad/rsrpp"
documentation = "https://github.com/akitenkrad/rsrpp/blob/main/docs/cli.md"
readme = "README.md"
keywords = ["pdf", "parser", "research", "paper", "cli"]
categories = ["command-line-utilities", "text-processing", "science"]

[[bin]]
name = "rsrpp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
rsrpp = { path = "../rsrpp", version = "2.0.0", default-features = false }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
default = ["table-detection"]
table-detection = ["rsrpp/table-detection"]

[package.metadata.release]
tag = true
