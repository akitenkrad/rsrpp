[package]
name = "rsrpp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
glob = { workspace = true }
indicatif = { workspace = true }
opencv = { workspace = true, optional = true }
quick-xml = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
sci-rs = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
strum = { workspace = true }
test-log = { workspace = true }
openai-tools = { workspace = true }
base64 = { workspace = true }

[features]
default = ["table-detection"]
# OpenCV-backed table region detection. Disable (`--no-default-features`) to build
# a binary with no OpenCV linkage at all; table regions are then not excluded from
# the body text.
table-detection = ["dep:opencv"]

[package.metadata.release]
tag = false
